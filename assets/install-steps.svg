<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-labelledby="t d">
  <title id="t">Instalar AgroPlane Desktop en tres pasos</title>
  <desc id="d">1. Descargar el instalador. 2. Seguir el asistente, que también instala el motor de procesamiento. 3. Cargar las fotos del vuelo y procesar.</desc>
  <rect width="1280" height="330" rx="18" fill="#070707"/>
  <rect x=".5" y=".5" width="1279" height="329" rx="17.5" fill="none" stroke="#F5F5F5" stroke-opacity=".08"/>

  <!-- Conectores -->
  <g fill="none" stroke="#5E9644" stroke-width="2" stroke-dasharray="5 6" stroke-opacity=".7">
    <path d="M426 150h12"/><path d="M834 150h12"/>
  </g>
  <g fill="#5E9644"><path d="M438 145l8 5-8 5Z"/><path d="M846 145l8 5-8 5Z"/></g>

  <!-- Tarjetas -->
  <g fill="#0E0F0C" stroke="#F5F5F5" stroke-opacity=".09">
    <rect x="40" y="36" width="384" height="258" rx="14"/>
    <rect x="448" y="36" width="384" height="258" rx="14"/>
    <rect x="856" y="36" width="384" height="258" rx="14"/>
  </g>

  <g font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#5E9644" letter-spacing="1">
    <text x="68" y="74">PASO 01</text>
    <text x="476" y="74">PASO 02</text>
    <text x="884" y="74">PASO 03</text>
  </g>

  <!-- 1 · Descargar: ventana del navegador con el .exe bajando -->
  <g transform="translate(68 92)">
    <rect width="150" height="96" rx="8" fill="#141612" stroke="#F5F5F5" stroke-opacity=".12"/>
    <path d="M0 20h150" stroke="#F5F5F5" stroke-opacity=".1"/>
    <g fill="#F5F5F5" fill-opacity=".25"><circle cx="12" cy="10" r="3"/><circle cx="22" cy="10" r="3"/><circle cx="32" cy="10" r="3"/></g>
    <rect x="18" y="34" width="114" height="44" rx="6" fill="#1B2016" stroke="#5E9644" stroke-opacity=".6"/>
    <g fill="none" stroke="#9BC27A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M38 44v14M32 53l6 6 6-6M30 64h16"/>
    </g>
    <rect x="58" y="47" width="62" height="5" rx="2.5" fill="#F5F5F5" fill-opacity=".55"/>
    <rect x="58" y="58" width="62" height="5" rx="2.5" fill="#F5F5F5" fill-opacity=".12"/>
    <rect x="58" y="58" width="40" height="5" rx="2.5" fill="#5E9644"/>
  </g>

  <!-- 2 · Instalar: asistente con componentes -->
  <g transform="translate(476 92)">
    <rect width="168" height="96" rx="8" fill="#141612" stroke="#F5F5F5" stroke-opacity=".12"/>
    <rect width="44" height="96" rx="8" fill="#1B2016"/>
    <path d="M36 0h8v96h-8Z" fill="#1B2016"/>
    <g fill="#5E9644"><circle cx="22" cy="22" r="4"/><circle cx="22" cy="40" r="4"/></g>
    <g fill="#F5F5F5" fill-opacity=".25"><circle cx="22" cy="58" r="4"/><circle cx="22" cy="76" r="4"/></g>
    <g transform="translate(58 22)">
      <rect width="14" height="14" rx="3" fill="#5E9644"/>
      <path d="M3.5 7.5l2.5 2.5 4.5-5" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="22" y="4" width="70" height="6" rx="3" fill="#F5F5F5" fill-opacity=".55"/>
    </g>
    <g transform="translate(58 46)">
      <rect width="14" height="14" rx="3" fill="#5E9644"/>
      <path d="M3.5 7.5l2.5 2.5 4.5-5" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="22" y="4" width="54" height="6" rx="3" fill="#F5F5F5" fill-opacity=".35"/>
    </g>
    <rect x="58" y="74" width="96" height="6" rx="3" fill="#F5F5F5" fill-opacity=".12"/>
    <rect x="58" y="74" width="66" height="6" rx="3" fill="#9BC27A"/>
  </g>

  <!-- 3 · Procesar: fotos del vuelo que se vuelven un ortomosaico -->
  <g transform="translate(884 92)">
    <g transform="rotate(-6 30 50)">
      <rect x="0" y="18" width="58" height="44" rx="4" fill="#1B2016" stroke="#F5F5F5" stroke-opacity=".2"/>
      <path d="M6 54l14-14 10 9 8-6 14 11" fill="none" stroke="#5E9644" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <rect x="16" y="30" width="58" height="44" rx="4" fill="#20271A" stroke="#F5F5F5" stroke-opacity=".25"/>
    <path d="M22 66l14-14 10 9 8-6 14 11" fill="none" stroke="#9BC27A" stroke-width="2" stroke-linejoin="round"/>
    <path d="M84 52h22M100 46l6 6-6 6" fill="none" stroke="#5E9644" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(116 12)">
      <rect width="72" height="80" rx="6" fill="#0D120A" stroke="#5E9644" stroke-opacity=".7"/>
      <path d="M6 20h60M6 34h60M6 48h60M6 62h60" stroke="#4D7C38" stroke-width="3" stroke-opacity=".6"/>
      <path d="M36 6v68" stroke="#4D7C38" stroke-width="3" stroke-opacity=".35"/>
      <path d="M10 70 30 28l14 24 8-10 14 28Z" fill="#5E9644" fill-opacity=".18"/>
      <circle cx="52" cy="22" r="5" fill="none" stroke="#F5F5F5" stroke-opacity=".7" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Textos -->
  <g font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif">
    <text x="68" y="226" fill="#F5F5F5" font-size="21" font-weight="600" letter-spacing="-.3">Descargá el instalador</text>
    <text x="68" y="252" fill="#9A9A9A" font-size="14.5">Un solo archivo, con AgroPlane adentro.</text>
    <text x="68" y="273" fill="#9A9A9A" font-size="14.5">Botón verde de arriba o la última release.</text>

    <text x="476" y="226" fill="#F5F5F5" font-size="21" font-weight="600" letter-spacing="-.3">Seguí el asistente</text>
    <text x="476" y="252" fill="#9A9A9A" font-size="14.5">Elegí la carpeta y el motor de procesamiento</text>
    <text x="476" y="273" fill="#9A9A9A" font-size="14.5">(OpenDroneMap, ~1,8 GB, se baja ahí mismo).</text>

    <text x="884" y="226" fill="#F5F5F5" font-size="21" font-weight="600" letter-spacing="-.3">Cargá tu vuelo y procesá</text>
    <text x="884" y="252" fill="#9A9A9A" font-size="14.5">Las fotos del dron se convierten en</text>
    <text x="884" y="273" fill="#9A9A9A" font-size="14.5">ortomosaico, elevación, nube de puntos y 3D.</text>
  </g>
</svg>
